version: 2

models:
  - name: stg_orders
    description: "Cleaned order staging model built from the Olist raw order source."

    columns:
      - name: order_id
        description: "Unique identifier for an order."
        data_tests:
          - not_null
          - unique

      - name: customer_id
        description: "Customer associated with the order."
        data_tests:
          - not_null

      - name: order_status
        description: "Current lifecycle status of the order."
        data_tests:
          - not_null
