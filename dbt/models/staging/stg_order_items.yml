version: 2

models:
  - name: stg_order_items
    description: "Cleaned order-item staging model built from the Olist raw order-item source."

    columns:
      - name: order_id
        description: "Order identifier associated with the item."
        data_tests:
          - not_null

      - name: order_item_id
        description: "Sequential item identifier within an order."
        data_tests:
          - not_null

      - name: product_id
        description: "Product associated with the order item."
        data_tests:
          - not_null

      - name: seller_id
        description: "Seller associated with the order item."
        data_tests:
          - not_null

      - name: price
        description: "Item purchase price."
        data_tests:
          - not_null

      - name: freight_value
        description: "Freight value associated with the item."
        data_tests:
          - not_null
