name: RetailIQ dbt CI

on:
  push:
    branches:
      - main
      - "feature/**"
  pull_request:
    branches:
      - main

jobs:
  dbt-ci:
    name: dbt project validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dbt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dbt
        run: |
          python -m pip install --upgrade pip
          pip install "dbt-core==1.12.5" "dbt-postgres==1.11.0"

      - name: Configure dbt profile
        shell: bash
        run: |
          mkdir -p "$HOME/.dbt"
          cat > "$HOME/.dbt/profiles.yml" <<'EOF'
          retailiq_dbt:
            target: ci
            outputs:
              ci:
                type: postgres
                host: "{{ env_var('POSTGRES_HOST') }}"
                port: "{{ env_var('POSTGRES_PORT') | int }}"
                dbname: "{{ env_var('POSTGRES_DB') }}"
                user: "{{ env_var('POSTGRES_USER') }}"
                password: "{{ env_var('POSTGRES_PASSWORD') }}"
                schema: public
                threads: 4
          EOF
      - name: Validate dbt project parsing
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: retailiq
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        run: |
          dbt parse --no-partial-parse

      - name: Validate dbt project graph
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: retailiq
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
        run: |
          dbt ls --resource-type model
          dbt ls --resource-type test
          dbt ls --resource-type source
